name: GeoCore isolated QA restore and log check

# Restores the isolated QA API to its original configuration (pre-deploy command, no temporary QA_* variables)
# and prints a secret-free summary of a named deployment's logs. QA only (project geocore-qa-20261110).
# Idempotent: safe to run when nothing needs restoring.

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-12966459-skf9q0
    paths:
      - '.github/workflows/geocore-qa-restore.yml'

permissions:
  contents: read

concurrency:
  group: geocore-qa-acceptance
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
      QA_API: https://geocore-api-qa-acceptance.up.railway.app
      INSPECT_DEPLOYMENT: 4091b064-609e-40dd-b78d-1df687b4c9c9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --global @railway/cli@4
      - name: Provisioning deployment logs (secret-free summary)
        shell: bash
        run: |
          set -uo pipefail
          source scripts/qa/qa_railway_ops.sh
          deployment_log_summary "$INSPECT_DEPLOYMENT"
      - name: Restore configuration and remove temporary variables
        shell: bash
        run: |
          set -uo pipefail
          source scripts/qa/qa_railway_ops.sh
          rc=0
          echo "pre-deploy before: $(predeploy_get)"
          [[ "$(predeploy_get)" == "$QA_ORIG_PREDEPLOY" ]] || predeploy_set "$QA_ORIG_PREDEPLOY" || rc=1
          [[ "$(predeploy_get)" == "$QA_ORIG_PREDEPLOY" ]] && echo "pre-deploy command is the original" || { echo "RESTORE FAILED: pre-deploy"; rc=1; }
          remove_temp_vars && echo "no temporary QA_* variables remain" || { echo "RESTORE FAILED: temporary variables remain"; rc=1; }
          wait_for_stable_success 1200 || rc=1
          wait_for_ready "$QA_API" 240 || rc=1
          exit $rc
