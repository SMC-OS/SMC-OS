name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simo
          POSTGRES_PASSWORD: simo
          POSTGRES_DB: simo_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://simo:simo@localhost:5432/simo_os
      JWT_SECRET_KEY: ci-test-secret
      SEED_ADMIN_EMAIL: owner@simo-os.local
      SEED_ADMIN_PASSWORD: ci-seed-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Test frontend components
        run: pnpm --filter web test

      - name: Test frontend runtime configuration
        run: pnpm --filter web test:runtime-config

      - name: Test frontend Docker contract
        run: pnpm --filter web test:docker-contract

      - name: Test frontend security headers
        run: pnpm --filter web test:security-headers

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simo
          POSTGRES_PASSWORD: simo
          POSTGRES_DB: simo_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://simo:simo@localhost:5432/simo_os
      JWT_SECRET_KEY: ci-test-secret
      SEED_ADMIN_EMAIL: owner@simo-os.local
      SEED_ADMIN_PASSWORD: ci-seed-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # playwright.config.ts's webServer array starts the real FastAPI
      # server (app.main:app, same module the repo root Dockerfile boots)
      # and the real Next.js dev server itself — this step needs no
      # separate "start backend"/"start frontend" steps of its own.
      - name: Run Playwright E2E
        run: pnpm --filter web test:e2e

      # Sprint 027 (docs/SPRINTS/sprint-027.md §6.8/§8 finding) —
      # playwright.config.ts already sets trace: "retain-on-failure" and
      # screenshot: "only-on-failure", but until this step existed a CI
      # E2E failure produced a red check and nothing else to inspect: the
      # trace/screenshot were written to the ephemeral runner and
      # discarded. `if: failure()` so a green run uploads nothing.
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
