name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simo
          POSTGRES_PASSWORD: simo
          POSTGRES_DB: simo_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://simo:simo@localhost:5432/simo_os
      JWT_SECRET_KEY: ci-test-secret
      SEED_ADMIN_EMAIL: owner@simo-os.local
      SEED_ADMIN_PASSWORD: ci-seed-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Test frontend runtime configuration
        run: pnpm --filter web test:runtime-config

      - name: Build
        run: pnpm build
