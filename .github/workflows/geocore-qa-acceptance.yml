name: GeoCore isolated QA authenticated acceptance

# Runs the eight STONE-GATE / DEF-003 browser acceptance tests against the ISOLATED, synthetic-data
# Railway QA environment (project geocore-qa-20261110, environment acceptance) from a GitHub-hosted
# runner. Manual dispatch or a push that changes this file. Never targets shared staging or production:
# the hosts and IDs are fixed below and the Playwright config independently refuses anything else.
#
# Secret: GEOCORE_QA_RAILWAY_TOKEN, a Railway PROJECT token for geocore-qa-20261110 / acceptance.
#
# `railway ssh` cannot be used with a project token (it needs an SSH key registered to a user or
# workspace). Synthetic owners are therefore provisioned as a one-off step of the QA API's own start
# command, inside Railway's private network. That changes QA service configuration for the duration of
# the run; the original command and all temporary variables are restored/removed in the final step, which
# runs even when tests fail and fails the job loudly if restoration cannot be proven.
# Traces are NOT uploaded (they contain session tokens). Passwords are generated per run and masked.

on:
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Stop at the first failure with a 90 s per-test timeout (fast iteration). Default runs all eight with full timeouts."
        type: boolean
        default: false
  push:
    branches:
      - ccr-12966459-skf9q0
      - qa/geocore-closure-20261105
    paths:
      - '.github/workflows/geocore-qa-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: geocore-qa-acceptance
  cancel-in-progress: false

jobs:
  qa-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QA_API: https://geocore-api-qa-acceptance.up.railway.app
      QA_WEB: https://geocore-web-qa-acceptance.up.railway.app
      EXPECTED_SHA: ae5cd3220faa565e8a329be2d1e8179b12626f37
      EXPECTED_MIGRATION: b6c7d8e9f0a1
      QA_PROJECT_ID: a16eaf0a-b5a5-4e8e-b79e-4d191457638e
      QA_ENVIRONMENT_ID: f948241d-446f-43ed-bff0-5d12decffd50
    steps:
      - name: Stop unless the owner has provided the QA project token
        env:
          RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "BLOCKED: repository secret GEOCORE_QA_RAILWAY_TOKEN is not set (owner action). Nothing was run."
            exit 1
          fi

      - name: Operations scripts from this workflow's own commit (full history, to compare deployed commits)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Acceptance tests from the deployed candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          path: candidate
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Install dependencies and browser
        working-directory: candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium
          npm install --global @railway/cli@4
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Verify project, environment and deployed SHAs (no SSH)
        env:
          RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/qa/qa_railway_ops.sh
          [[ "$QA_API" == "https://geocore-api-qa-acceptance.up.railway.app" ]]
          [[ "$QA_WEB" == "https://geocore-web-qa-acceptance.up.railway.app" ]]
          railway status --json | jq -r '"project: \(.name)", (.environments.edges[]?.node | "environment: \(.name) (\(.id))")' | tee qa-identity.txt
          grep -Fxq "project: geocore-qa-20261110" qa-identity.txt
          grep -Fxq "environment: acceptance ($QA_ENVIRONMENT_ID)" qa-identity.txt
          for svc in geocore-api-qa geocore-web-qa; do
            line="$(railway deployment list --service "$svc" --environment "$QA_ENV" --json --limit 5 | jq -r 'sort_by(.createdAt) | last | "\(.status) \(.meta.commitHash)"')"
            read -r dstatus dcommit <<<"$line"
            how="$(commit_matches_candidate "$dcommit" "$EXPECTED_SHA")"
            echo "$svc: $dstatus commit=$dcommit candidate=$EXPECTED_SHA match=$how" | tee -a qa-identity.txt
            [[ "$dstatus" == "SUCCESS" ]]
          done
          curl -fsS --max-time 30 --retry 3 "$QA_API/health" >/dev/null
          curl -fsS --max-time 30 --retry 3 "$QA_API/ready" >/dev/null
          curl -fsS --max-time 30 --retry 3 "$QA_WEB/login" >/dev/null
          [[ "$(git -C candidate rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          echo "original start command: $(start_get)" | tee -a qa-identity.txt
          [[ "$(start_get)" == "$QA_ORIG_START" ]]

      - name: Provision two synthetic owners (one-off start-command step; configuration restored in the final step)
        env:
          RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/qa/qa_railway_ops.sh
          echo "PROVISION_STARTED=1" >> "$GITHUB_ENV"
          RUN="$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ATTEMPT}"
          PW_A="$(openssl rand -hex 16)Aa1!"
          PW_B="$(openssl rand -hex 16)Bb2!"
          echo "::add-mask::$PW_A"
          echo "::add-mask::$PW_B"
          base64 -w0 scripts/qa/provision_synthetic_owner.py | set_qa_var QA_PROVISION_PY_B64
          provision_script_sh | base64 -w0 | set_qa_var QA_PROVISION_SH_B64
          printf '%s' "stone-gate-$RUN@acceptance.invalid" | set_qa_var QA_OWNER_A_EMAIL
          printf '%s' "QA acceptance A $RUN" | set_qa_var QA_OWNER_A_COMPANY
          printf '%s' "$PW_A" | set_qa_var QA_OWNER_A_PW
          printf '%s' "stone-gate-other-$RUN@acceptance.invalid" | set_qa_var QA_OWNER_B_EMAIL
          printf '%s' "QA acceptance B $RUN" | set_qa_var QA_OWNER_B_COMPANY
          start_set "$QA_PROVISION_START"
          [[ "$(start_get)" == "$QA_PROVISION_START" ]]
          read -r PREV _ _ < <(latest_deployment)
          # A variable change creates a NEW deployment from the current configuration (verified in earlier runs).
          printf '%s' "$PW_B" | railway variable set QA_OWNER_B_PW --stdin --service geocore-api-qa --environment "$QA_ENV" >/dev/null
          wait_for_new_deployment "$PREV" 900 | tee -a qa-identity.txt
          read -r PROV_ID _ _ < <(latest_deployment)
          deployment_log_summary "$PROV_ID" | tee -a qa-identity.txt
          wait_for_ready "$QA_API" 300 | tee -a qa-identity.txt
          EMAIL_A="stone-gate-$RUN@acceptance.invalid"
          EMAIL_B="stone-gate-other-$RUN@acceptance.invalid"
          for pair in "A|$EMAIL_A|$PW_A" "B|$EMAIL_B|$PW_B"; do
            IFS='|' read -r who email pw <<<"$pair"
            code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$QA_API/api/v1/auth/login" -H 'Content-Type: application/json' \
                    -d "$(jq -nc --arg e "$email" --arg p "$pw" '{email:$e,password:$p}')" || true)"
            echo "owner $who login status=$code" | tee -a qa-identity.txt
            [[ "$code" == "200" ]]
          done
          {
            echo "STAGING_OWNER_EMAIL=stone-gate-$RUN@acceptance.invalid"
            echo "STAGING_OWNER_PASSWORD=$PW_A"
            echo "STAGING_OTHER_OWNER_EMAIL=stone-gate-other-$RUN@acceptance.invalid"
            echo "STAGING_OTHER_OWNER_PASSWORD=$PW_B"
          } >> "$GITHUB_ENV"

      - name: Browser-session path probe (diagnostic; values redacted)
        env:
          RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
        continue-on-error: true
        shell: bash
        run: |
          set +x
          echo "== web service URL settings (non-secret)"
          railway variable list --service geocore-web-qa --environment "$QA_ENVIRONMENT_ID" --kv 2>/dev/null | grep -E '^(NEXT_PUBLIC_API_URL|API_PROXY_URL|APP_ENV)=' | sort
          probe() {
            echo "== $1"
            curl -sS -D - -o /dev/null --max-time 30 -X POST "$2/api/v1/auth/login" -H "Origin: $QA_WEB" -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg e "$STAGING_OWNER_EMAIL" --arg p "$STAGING_OWNER_PASSWORD" '{email:$e,password:$p}')" \
              | tr -d '\r' | grep -iE '^(HTTP/|set-cookie|access-control-allow|vary)' | sed -E 's/^(set-cookie: [^=]+)=[^;]*/\1=<redacted>/I'
          }
          probe "login through the WEB origin (same-origin proxy path)" "$QA_WEB"
          probe "login against the API origin directly (cross-site when called from the web page)" "$QA_API"

      - name: Run the eight acceptance tests in fresh browser contexts
        working-directory: candidate/apps/web
        env:
          STAGING_WEB_URL: ${{ env.QA_WEB }}
          STAGING_API_URL: ${{ env.QA_API }}
          DIAGNOSE: ${{ inputs.diagnose }}
        run: |
          args=""
          if [[ "${DIAGNOSE:-false}" == "true" ]]; then args="--max-failures=1 --timeout=90000"; fi
          pnpm exec playwright test -c playwright.staging.config.ts --trace off $args

      - name: Deployed lifecycle, invoice numbering, quote amendments, PDF text and portal scope
        if: ${{ !cancelled() && env.STAGING_OWNER_EMAIL != '' }}
        shell: bash
        run: python3 scripts/qa/qa_lifecycle_check.py
        env:
          QA_API: ${{ env.QA_API }}

      - name: Deployed Owner/Staff roles, remaining tenant isolation, editing, tasks and full workflow
        if: ${{ !cancelled() && env.STAGING_OWNER_EMAIL != '' }}
        shell: bash
        run: python3 scripts/qa/qa_roles_isolation_check.py
        env:
          QA_API: ${{ env.QA_API }}

      - name: Stone job from enquiry to completion through every workflow gate
        if: ${{ !cancelled() && env.STAGING_OWNER_EMAIL != '' }}
        shell: bash
        run: python3 scripts/qa/qa_stone_workflow_check.py
        env:
          QA_API: ${{ env.QA_API }}

      - name: Bounded capacity test (30 virtual users maximum, 4,000 requests, isolated QA only)
        if: ${{ !cancelled() && env.STAGING_OWNER_EMAIL != '' }}
        shell: bash
        run: python3 scripts/qa/qa_capacity_check.py
        env:
          QA_API: ${{ env.QA_API }}

      - name: On failure, print the page snapshots Playwright captured (text only)
        if: failure()
        shell: bash
        run: |
          cd candidate/apps/web/staging-acceptance-results/artifacts 2>/dev/null || { echo "no artifacts directory"; exit 0; }
          for f in */error-context.md; do
            echo "================ $f"
            head -70 "$f"
          done 2>/dev/null | cut -c1-220 | head -260

      - name: Restore the original QA configuration and remove temporary variables
        env:
          RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          source scripts/qa/qa_railway_ops.sh
          [[ "${PROVISION_STARTED:-}" == "1" ]] || { echo "nothing to restore: provisioning never started"; exit 0; }
          rc=0
          start_set "$QA_ORIG_START" || rc=1
          [[ "$(start_get)" == "$QA_ORIG_START" ]] && echo "start command restored" | tee -a qa-identity.txt || { echo "RESTORE FAILED: start command"; rc=1; }
          [[ "$(predeploy_get)" == "$QA_ORIG_PREDEPLOY" ]] || predeploy_set "$QA_ORIG_PREDEPLOY" || rc=1
          remove_temp_vars && echo "temporary variables removed" | tee -a qa-identity.txt || { echo "RESTORE FAILED: temporary variables remain"; rc=1; }
          wait_for_stable_success 1200 | tee -a qa-identity.txt || rc=1
          wait_for_ready "$QA_API" 240 | tee -a qa-identity.txt || rc=1
          exit $rc

      - name: Retain results summary and screenshots (no traces, no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocore-isolated-qa-acceptance
          path: |
            qa-identity.txt
            qa-lifecycle-results.json
            qa-roles-results.json
            qa-owner-decisions.json
            qa-capacity-results.json
            qa-stone-workflow-results.json
            qa-pdf-evidence/invoice-a.pdf
            candidate/apps/web/staging-acceptance-results/results.json
            candidate/apps/web/staging-acceptance-results/artifacts/**/*.png
          retention-days: 14
          if-no-files-found: warn
