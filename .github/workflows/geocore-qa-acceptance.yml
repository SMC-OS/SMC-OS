name: GeoCore isolated QA authenticated acceptance

# Runs the eight STONE-GATE / DEF-003 browser acceptance tests against the ISOLATED, synthetic-data
# Railway QA environment (project geocore-qa-20261110, environment acceptance) from a GitHub-hosted
# runner. Manual dispatch or trusted review-branch workflow changes only. Never targets shared staging or production: the hosts are fixed below and the
# Playwright config independently refuses anything else.
#
# It needs ONE secret that only the owner can create:
#   GEOCORE_QA_RAILWAY_TOKEN  a Railway PROJECT token for geocore-qa-20261110 / acceptance only.
# Without it the job fails at the first step with "BLOCKED". It never reports a pass it did not earn.
#
# What it does: provisions two synthetic, e-mail-verified owners (distinct workspaces) inside the QA
# API container, runs the acceptance suite, uploads the results summary and screenshots.
# Traces are NOT uploaded: they contain session tokens. Passwords are generated per run and masked.

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-12966459-skf9q0
      - qa/geocore-closure-20261105
    paths:
      - '.github/workflows/geocore-qa-acceptance.yml'

permissions:
  contents: read

jobs:
  qa-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QA_API: https://geocore-api-qa-acceptance.up.railway.app
      QA_WEB: https://geocore-web-qa-acceptance.up.railway.app
      EXPECTED_SHA: 7644a222127059991eb8a88e93399ccf02495af9
      EXPECTED_MIGRATION: a5f6b7c8d9e0
      QA_PROJECT_ID: a16eaf0a-b5a5-4e8e-b79e-4d191457638e
      QA_ENVIRONMENT_ID: f948241d-446f-43ed-bff0-5d12decffd50
    steps:
      - name: Stop unless the owner has provided the QA project token
        env:
          RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "BLOCKED: repository secret GEOCORE_QA_RAILWAY_TOKEN is not set (owner action). Nothing was run."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and browser
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium
          npm install --global @railway/cli@4

      - name: Verify the target is the isolated QA environment
        env:
          RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QA_API" == "https://geocore-api-qa-acceptance.up.railway.app" ]]
          [[ "$QA_WEB" == "https://geocore-web-qa-acceptance.up.railway.app" ]]
          curl -fsS --max-time 30 --retry 3 "$QA_API/health" >/dev/null
          curl -fsS --max-time 30 --retry 3 "$QA_API/ready" >/dev/null
          # Record, without printing secrets, what is deployed and migrated.
          railway ssh --project "$QA_PROJECT_ID" --environment "$QA_ENVIRONMENT_ID" --service geocore-api-qa -- sh -c 'printf "railway_env=%s project=%s\n" "$RAILWAY_ENVIRONMENT_NAME" "$RAILWAY_PROJECT_NAME"; printf "git_sha=%s\n" "${RAILWAY_GIT_COMMIT_SHA:-unknown}"; alembic current 2>/dev/null | tail -1' | tee qa-identity.txt
          grep -q "railway_env=acceptance" qa-identity.txt
          grep -q "project=geocore-qa-20261110" qa-identity.txt
          grep -Fxq "git_sha=$EXPECTED_SHA" qa-identity.txt
          grep -Eq "^$EXPECTED_MIGRATION[[:space:]]+\\(head\\)$" qa-identity.txt
          railway ssh --project "$QA_PROJECT_ID" --environment "$QA_ENVIRONMENT_ID" --service geocore-web-qa -- sh -c 'printf "railway_env=%s project=%s\n" "$RAILWAY_ENVIRONMENT_NAME" "$RAILWAY_PROJECT_NAME"; printf "git_sha=%s\n" "${RAILWAY_GIT_COMMIT_SHA:-unknown}"' | tee qa-web-identity.txt
          grep -Fxq "railway_env=acceptance project=geocore-qa-20261110" qa-web-identity.txt
          grep -Fxq "git_sha=$EXPECTED_SHA" qa-web-identity.txt
          curl -fsS --max-time 30 --retry 3 "$QA_WEB/login" >/dev/null
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

      - name: Provision two synthetic owners in separate workspaces
        env:
          RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ATTEMPT}"
          PW_A="$(openssl rand -hex 16)Aa1!"
          PW_B="$(openssl rand -hex 16)Bb2!"
          echo "::add-mask::$PW_A"
          echo "::add-mask::$PW_B"
          provision() {  # the image has no scripts/ directory, so the script is piped over stdin
            railway ssh --project "$QA_PROJECT_ID" --environment "$QA_ENVIRONMENT_ID" --service geocore-api-qa -- \
              env SYNTHETIC_OWNER_PASSWORD="$2" python - \
              --email "$1" --company "$3" --confirm-environment acceptance < scripts/qa/provision_synthetic_owner.py
          }
          provision "stone-gate-$RUN@acceptance.invalid" "$PW_A" "QA acceptance A $RUN"
          provision "stone-gate-other-$RUN@acceptance.invalid" "$PW_B" "QA acceptance B $RUN"
          {
            echo "STAGING_OWNER_EMAIL=stone-gate-$RUN@acceptance.invalid"
            echo "STAGING_OWNER_PASSWORD=$PW_A"
            echo "STAGING_OTHER_OWNER_EMAIL=stone-gate-other-$RUN@acceptance.invalid"
            echo "STAGING_OTHER_OWNER_PASSWORD=$PW_B"
          } >> "$GITHUB_ENV"

      - name: Run the eight acceptance tests in fresh browser contexts
        working-directory: apps/web
        env:
          STAGING_WEB_URL: ${{ env.QA_WEB }}
          STAGING_API_URL: ${{ env.QA_API }}
        run: pnpm exec playwright test -c playwright.staging.config.ts --trace off

      - name: Retain results summary and screenshots (no traces, no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocore-isolated-qa-acceptance
          path: |
            qa-identity.txt
            qa-web-identity.txt
            apps/web/staging-acceptance-results/results.json
            apps/web/staging-acceptance-results/artifacts/**/*.png
          retention-days: 14
          if-no-files-found: warn
