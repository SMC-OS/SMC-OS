name: GeoCore isolated QA pre-deploy probe

# Establishes whether the QA API's pre-deploy command executes an appended step, using a deliberately
# FAILING command. QA only. Always restores the original configuration. Nothing here touches data.

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-12966459-skf9q0
    paths:
      - '.github/workflows/geocore-qa-probe.yml'

permissions:
  contents: read

concurrency:
  group: geocore-qa-acceptance
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
      QA_API: https://geocore-api-qa-acceptance.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --global @railway/cli@4
      - name: Probe A - appended '&& false' must FAIL the deployment if the suffix is executed
        shell: bash
        run: |
          set -uo pipefail
          source scripts/qa/qa_railway_ops.sh
          [[ "$(predeploy_get)" == "$QA_ORIG_PREDEPLOY" ]] || { echo "unexpected starting pre-deploy"; exit 1; }
          echo "PROBE_STARTED=1" >> "$GITHUB_ENV"
          predeploy_set "$QA_ORIG_PREDEPLOY && echo QA_PROBE_A && false" || exit 1
          read -r PREV _ _ < <(latest_deployment)
          echo "$GITHUB_RUN_ID" | railway variable set QA_PROBE --stdin --service geocore-api-qa --environment "$QA_ENV" >/dev/null
          result="$(wait_for_new_deployment "$PREV" 900)"; echo "PROBE A result: $result"
          case "$result" in
            *FAILED*|*CRASHED*) echo "CONCLUSION: the appended step IS executed (a failing suffix failed the deployment)";;
            *SUCCESS*) echo "CONCLUSION: the appended step is NOT executed (a failing suffix still gave SUCCESS)";;
            *) echo "CONCLUSION: inconclusive";;
          esac
      - name: Restore original configuration
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          source scripts/qa/qa_railway_ops.sh
          [[ "${PROBE_STARTED:-}" == "1" ]] || exit 0
          rc=0
          predeploy_set "$QA_ORIG_PREDEPLOY" || rc=1
          [[ "$(predeploy_get)" == "$QA_ORIG_PREDEPLOY" ]] && echo "pre-deploy restored" || { echo "RESTORE FAILED"; rc=1; }
          railway variable delete QA_PROBE --service geocore-api-qa --environment "$QA_ENV" >/dev/null 2>&1 || true
          wait_for_stable_success 1200 || rc=1
          wait_for_ready "$QA_API" 240 || rc=1
          exit $rc
